<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quant Ops Agent Workbench · 交易支持工单复核台（合成原型）</title>
  <style>
    :root {
      --bg: #f6f7f5;
      --card: #ffffff;
      --ink: #18221d;
      --muted: #5c6b63;
      --accent: #143628;
      --border: #dfe5e1;
      --crit: #b91c1c;
      --high: #b45309;
      --ok: #15803d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
    }
    header {
      background: var(--accent);
      color: #fff;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { margin: 0; font-size: 20px; letter-spacing: 0.3px; }
    header .sub { font-size: 13px; opacity: 0.88; margin-top: 4px; }
    .badge-bar { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill {
      background: rgba(255,255,255,0.14);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    main { max-width: 1120px; margin: 24px auto; padding: 0 20px 48px; }
    .notice {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .kpi .label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .kpi .val { font-size: 26px; font-weight: 800; margin-top: 4px; color: var(--accent); }
    .ticket {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .ticket-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    .tag {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }
    .sev-CRITICAL { background: #fee2e2; color: var(--crit); }
    .sev-HIGH { background: #fef3c7; color: var(--high); }
    .sev-MEDIUM { background: #dcfce7; color: var(--ok); }
    .status-PENDING_APPROVAL { background: #fef3c7; color: #92400e; }
    .status-APPROVED { background: #dcfce7; color: #166534; }
    .status-REJECTED { background: #fee2e2; color: #991b1b; }
    .status-AUTO_ARCHIVED { background: #e0f2fe; color: #075985; }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      margin-top: 12px;
    }
    .panel {
      background: #f9faf9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
    }
    .panel h4 { margin: 0 0 6px; font-size: 13px; color: var(--accent); }
    .guardrail-box {
      margin-top: 12px;
      padding: 10px 14px;
      border-left: 4px solid var(--high);
      background: #fffbeb;
      font-size: 13px;
      border-radius: 0 6px 6px 0;
    }
    .guardrail-box.ok { border-left-color: var(--ok); background: #f0fdf4; }
    .actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    button {
      border: none;
      border-radius: 7px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-approve { background: var(--accent); color: #fff; }
    .btn-reject { background: #e5e7eb; color: #1f2937; }
    code { background: #eef2ef; padding: 2px 5px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Quant Ops Agent Workbench · 交易支持工单复核台</h1>
      <div class="sub">合成数据演示原型：规则复算差异 · 预设 Runbook 路由 · 人工审批状态流转（未接入大模型与实盘执行器）</div>
    </div>
    <div class="badge-bar">
      <span class="pill" id="data-source-pill">数据源加载中...</span>
      <span class="pill">演示状态 · 刷新恢复初始</span>
    </div>
  </header>
  <main>
    <div class="notice">
      说明：本页面仅在浏览器内存中演示工单状态流转（刷新页面即恢复初始状态），未连接后端数据库或实盘交易接口。使用 <code>python3 -m http.server 8000 --bind 127.0.0.1</code> 后访问 <code>/web/index.html</code> 可直接读取刚生成的 <code>evidence/workbench_snapshot.json</code>。
    </div>
    <div class="kpi-grid" id="kpis"></div>
    <div id="tickets"></div>
  </main>

  <script>
    const FALLBACK_SNAPSHOT = {
      summary: { total_alerts: 4, routed_to_human_review: 3, auto_archived_read_only: 1, live_write_executed: 0 },
      tickets: [
        {
          ticket_id: "TKT-001",
          status: "PENDING_APPROVAL",
          runbook_id: "RB-FUT-101",
          retained_log_chars: 223,
          routing_confidence: 0.96,
          root_cause_analysis: "近远月合约切换时未按独立合约逐日盯市，跨期价差被误计入账面收益。",
          proposed_steps: ["核对换月日近远月结算价与跨期价差（roll_gap_points）", "按实际持有合约逐日盯市重算损益", "生成调整建议单送人工复核，不直接修改历史成交库"],
          alert: { alert_id: "ALT-2026-001", severity: "HIGH", title: "期货换月账面差异 (+120.00 元)", summary: "近远月合约直接拼接计算收益 280.00 元，逐日盯市实际毛利 160.00 元（扣费 12.00 元后净利 148.00 元），差额 120.00 元来自换月日 6 点跨期价差。", recommended_action: "ADJUST_RECON_LEDGER" },
          guardrail: { allowed_auto_execute: false, policy_triggered: "ROUTE_WRITE_TO_HUMAN_REVIEW", reason: "建议动作 `ADJUST_RECON_LEDGER` 涉及账本或仓位变更，原型将其送入人工复核队列，不执行自动写入。" }
        },
        {
          ticket_id: "TKT-002",
          status: "PENDING_APPROVAL",
          runbook_id: "RB-MM-204",
          retained_log_chars: 197,
          routing_confidence: 0.96,
          root_cause_analysis: "期末留存单边多头库存，收盘中价下跌拖累整体损益，掩盖了价差收益。",
          proposed_steps: ["拆解账目为价差捕获（+3.00）、中价变动（-5.80）与费用（-0.30）", "核对期末 100 股库存敞口与当日风控限额", "生成降仓或对冲建议单，交由值班人员复核决定"],
          alert: { alert_id: "ALT-2026-002", severity: "CRITICAL", title: "做市库存与损益分解 (-3.10 元)", summary: "策略 4 笔成交捕获价差 +3.00 元，期末持有 100 股多头库存，市场中价变动拖累 -5.80 元、手续费 -0.30 元，净损益 -3.10 元。", recommended_action: "AUTO_HEDGE_INVENTORY" },
          guardrail: { allowed_auto_execute: false, policy_triggered: "ROUTE_WRITE_TO_HUMAN_REVIEW", reason: "建议动作 `AUTO_HEDGE_INVENTORY` 涉及账本或仓位变更，原型将其送入人工复核队列，不执行自动写入。" }
        },
        {
          ticket_id: "TKT-003",
          status: "PENDING_APPROVAL",
          runbook_id: "RB-EXEC-309",
          retained_log_chars: 257,
          routing_confidence: 0.96,
          root_cause_analysis: "撤单请求发出与撤单确认返回之间发生飞行中成交，导致本地缓存少记仓位。",
          proposed_steps: ["以交易所成交回报为准核对总成交量（60 股 vs 本地 40 股）", "确认漏记的 20 股回报序号并做幂等重放", "生成仓位修正建议单，送人工复核后再同步 OMS 仓位"],
          alert: { alert_id: "ALT-2026-003", severity: "HIGH", title: "撤单竞态仓位差异 (+20 股漏记)", summary: "100 股买单：40 股在发撤单前成交，20 股在撤单请求与确认返回之间成交，40 股成功撤单。成交回报合计 60 股，本地缓存仅记 40 股，少记 20 股。", recommended_action: "SYNC_EXCHANGE_POSITION" },
          guardrail: { allowed_auto_execute: false, policy_triggered: "ROUTE_WRITE_TO_HUMAN_REVIEW", reason: "建议动作 `SYNC_EXCHANGE_POSITION` 涉及账本或仓位变更，原型将其送入人工复核队列，不执行自动写入。" }
        },
        {
          ticket_id: "TKT-004",
          status: "AUTO_ARCHIVED",
          runbook_id: "RB-DATA-402",
          retained_log_chars: 170,
          routing_confidence: 0.96,
          root_cause_analysis: "历史数据修订场景下的双时间戳（Effective Date / As-Of Date）快照核验。",
          proposed_steps: ["确认查询按 as_of_date 过滤历史快照", "归档本次只读核验记录至审计日志"],
          alert: { alert_id: "ALT-2026-004", severity: "MEDIUM", title: "PIT 财报修订快照核验通过", summary: "指标于 04-10 初发 100、04-15 修订为 80。时间点查询在 09/11/16 日严格返回 None -> 100 -> 80，未发生未来数据泄露。", recommended_action: "LOG_AUDIT_PASS" },
          guardrail: { allowed_auto_execute: true, policy_triggered: "READ_ONLY_AUDIT_PASS", reason: "只读核验且命中预设类别，自动归档审计记录。" }
        }
      ]
    };

    let state = JSON.parse(JSON.stringify(FALLBACK_SNAPSHOT));
    let dataSource = "内置样例（直接双击打开）";

    function render() {
      document.getElementById("data-source-pill").textContent = "数据源：" + dataSource;
      const pendingCount = state.tickets.filter(t => t.status === "PENDING_APPROVAL").length;
      const approvedCount = state.tickets.filter(t => t.status === "APPROVED").length;
      const rejectedCount = state.tickets.filter(t => t.status === "REJECTED").length;
      document.getElementById("kpis").innerHTML = `
        <div class="kpi"><div class="label">样例工单总数</div><div class="val">${state.tickets.length}</div></div>
        <div class="kpi"><div class="label">待人工复核</div><div class="val">${pendingCount}</div></div>
        <div class="kpi"><div class="label">已批准 / 已驳回</div><div class="val">${approvedCount} / ${rejectedCount}</div></div>
        <div class="kpi"><div class="label">实盘业务写入</div><div class="val">0</div></div>
      `;
      document.getElementById("tickets").innerHTML = state.tickets.map((t, idx) => `
        <div class="ticket">
          <div class="ticket-head">
            <div>
              <span class="tag sev-${t.alert.severity}">${t.alert.severity}</span>
              <strong style="margin-left:8px;font-size:16px;">${t.ticket_id} · ${t.alert.title}</strong>
            </div>
            <span class="tag status-${t.status}">${t.status}</span>
          </div>
          <div style="font-size:14px;color:#334155;">${t.alert.summary}</div>
          <div class="grid-2">
            <div class="panel">
              <h4>预设 Runbook 匹配（<code>${t.runbook_id}</code>）</h4>
              <div>${t.root_cause_analysis}</div>
              <div style="margin-top:6px;color:#64748b;">去重截断后日志：<b>${t.retained_log_chars} 字符</b> · 预设路由分：<b>${t.routing_confidence.toFixed(2)}</b></div>
            </div>
            <div class="panel">
              <h4>建议处置步骤（动作：<code>${t.alert.recommended_action}</code>）</h4>
              <ol style="margin:0;padding-left:18px;">${t.proposed_steps.map(s => `<li>${s}</li>`).join("")}</ol>
            </div>
          </div>
          <div class="guardrail-box ${t.guardrail.allowed_auto_execute ? "ok" : ""}">
            <strong>路由规则 [${t.guardrail.policy_triggered}]：</strong> ${t.guardrail.reason}
          </div>
          <div class="actions">
            ${t.status === "PENDING_APPROVAL" ? `
              <button class="btn-approve" onclick="decide(${idx}, true)">演示批准 (Approve)</button>
              <button class="btn-reject" onclick="decide(${idx}, false)">演示驳回 (Reject)</button>
            ` : `<span style="font-size:12px;color:#64748b;">当前演示状态：<b>${t.status}</b>（刷新页面恢复初始）</span>`}
          </div>
        </div>
      `).join("");
    }

    function decide(idx, approve) {
      if (state.tickets[idx].status !== "PENDING_APPROVAL") return;
      state.tickets[idx].status = approve ? "APPROVED" : "REJECTED";
      render();
    }

    fetch("../evidence/workbench_snapshot.json")
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(data => {
        state = data;
        dataSource = "evidence/workbench_snapshot.json";
        render();
      })
      .catch(() => render());
  </script>
</body>
</html>
